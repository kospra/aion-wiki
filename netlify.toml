[build]
  command = "npm ci && npm run validate"
  publish = "build/client"

[build.environment]
  NPM_VERSION = "12.1.0"

[[redirects]]
  from = "/articles/class-passives"
  to = "/articles/class-builds/"
  status = 301

[[redirects]]
  from = "/categories/class-passives"
  to = "/categories/class-builds/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"